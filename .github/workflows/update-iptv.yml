name: IPTV Auto Updater

on:
  schedule:
    # Executa a cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: iptv-auto-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Testes Automatizados
        run: |
          pytest -v tests/

      - name: Executar Coleta, Validação e Geração da Playlist
        run: |
          python scripts/main.py

      - name: Validar Integridade do Arquivo Gerado (main.m3u)
        run: |
          if [ ! -s "main.m3u" ]; then
            echo "::error::O arquivo main.m3u está vazio ou não foi gerado!"
            exit 1
          fi
          if ! head -n 1 main.m3u | grep -q "^#EXTM3U"; then
            echo "::error::Cabeçalho #EXTM3U inválido no main.m3u!"
            exit 1
          fi
          if ! grep -q "^#EXTINF:" main.m3u; then
            echo "::error::Nenhum canal #EXTINF encontrado no main.m3u!"
            exit 1
          fi
          echo "Validação do main.m3u concluída com sucesso."

      - name: Realizar Commit e Push das Alterações
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Verificar se houve modificações em main.m3u ou no cache de status
          git status --porcelain

          if git diff --quiet main.m3u data/channel_status.json; then
            echo "Nenhuma alteração detectada na playlist ou no estado dos canais. Commit dispensado."
          else
            echo "Alterações identificadas. Gravando commit..."
            git add main.m3u data/channel_status.json
            git commit -m "chore(iptv): atualizar main.m3u e status de disponibilidade [skip ci]"
            git push origin main
            echo "Alterações enviadas com sucesso para a branch main."
          fi
